name: Build Debian Package

on:
  push:
    branches: [ 2.x ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 2.x ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y debhelper-compat dh-exec dh-make devscripts build-essential gdc ldc make qtchooser qtbase5-dev libcurl4-openssl-dev libsqlite3-dev

    - name: Build Debian package
      run: |
        # Build the package directly using dpkg-buildpackage
        # This will use the existing debian/ directory structure
        dpkg-buildpackage -b -uc -us

    - name: Upload Debian artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages
        path: "*.deb"
